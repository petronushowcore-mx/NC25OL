name: acceptance

on:
  push:
    branches: [main, feature/optional-observation-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run the acceptance suite
        run: python -B tests/run_acceptance.py

      - name: Check the local example and its components
        run: python -B -m unittest discover -s examples/local_release -p "test_*.py" -v

      - name: Run local example source mutations
        run: |
          python -B examples/local_release/mutate_scenario.py --scratch "${{ runner.temp }}"
          python -B examples/local_release/mutate_document_release.py --scratch "${{ runner.temp }}"
          python -B examples/local_release/mutate_exchange.py --scratch "${{ runner.temp }}"

      - name: Check local Spectrum observations
        run: python -B -m unittest discover -s examples/spectrum_observation -p "test_*.py" -v

      - name: Run Spectrum observation source mutations
        run: python -B examples/spectrum_observation/mutate_spectrum_observation.py --scratch "${{ runner.temp }}"

      - name: Check local Spectrum source releases
        run: python -B -m unittest discover -s examples/spectrum_release -p "test_*.py" -v

      - name: Run source-release and document-session mutations
        run: |
          python -B examples/spectrum_release/mutate_spectrum_release.py --scratch "${{ runner.temp }}"
          python -B examples/local_release/mutate_document_session.py --scratch "${{ runner.temp }}"

      - name: Build the source bundle and verify it is manifest-bound
        run: python -B tools/build_review_bundle.py --output "${{ runner.temp }}/review-bundle.md"

  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the Lean sources outside the package
        run: cp -R modules/observation_engine "${{ runner.temp }}/observation-engine"
      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ runner.temp }}/observation-engine
          auto-config: false
          build: true
          use-github-cache: false
          use-mathlib-cache: false
      - name: Verify proofs, executable cases and source mutations
        run: python -B "${{ runner.temp }}/observation-engine/verify.py" --scratch "${{ runner.temp }}/lean-checks" --mutations
      - name: Check observation admission and mutations
        env:
          NC25_OBSERVATION_ENGINE: ${{ runner.temp }}/observation-engine/.lake/build/bin/observation-engine
        run: |
          mkdir -p "${{ runner.temp }}/observation-mutations"
          python -B -m unittest discover -s examples/observation_admission -p "test_*.py" -v
          python -B examples/observation_admission/mutate_observation_admission.py --scratch "${{ runner.temp }}/observation-mutations" --jobs 2
