  responses:
    ContractError:
      description: Contract input is incomplete, contradictory, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency, activation, or exactly-once conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The bound object does not exist in this declaration.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The transport identity presented no workload scope, or a scope that is
        not the exact scope this route requires. The check runs before the
        handler, so it fails closed regardless of body validity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >-
        The request body exceeds the adapter's declared bound. The bound
        protects the reference adapter against a hostile Content-Length.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >-
        The engine halted on an integrity failure, or the adapter caught a
        fault it does not classify and answered with INTERNAL_FAILURE. In both
        cases execution remains blocked and nothing was recorded for this
        request. Declared on every operation: the adapter's last-resort guard
        can answer on any route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
