openapi: 3.1.0
info:
  title: NC25OL - Navigational Cybernetics 2.5 Open Ledger API
  version: 0.0.11
  description: >-
    Role-separated reference contract for activating one connection
    declaration, issuing and revoking workload authority, evaluating bound
    intents, consuming single-use permits, and reading architect or hash-only
    registry projections. Every route requires mTLS and a scoped workload
    identity. Beyond the responses listed per route, any route returns 503 on a
    local integrity-halt condition and 400 on a malformed path parameter. Every
    status the reference WSGI adapter can emit is declared: 403 for a missing
    or wrong workload scope on every route, and 413 for an oversized body on
    every body-bearing route.
servers:
  - url: https://ledger.example.invalid
    description: Non-routable documentation placeholder
tags:
  - name: Governance
  - name: Operator
  - name: Executor
  - name: Architect
  - name: Registry
paths:
  /v1/declarations:activate:
    post:
      tags:
        - Governance
      operationId: activateDeclaration
      summary: Activate exact profile and declaration hashes
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - profile
                - declaration
                - activated_by
                - approval_evidence_ref
              properties:
                profile:
                  $ref: ../core/schemas/profile.schema.json
                declaration:
                  $ref: ../core/schemas/connection-declaration.schema.json
                activated_by:
                  type: string
                approval_evidence_ref:
                  type: string
      responses:
        "201":
          description: >-
            Declaration activated. The HTTP adapter wraps the reference
            engine's returned declaration hash with the profile hash and
            ACTIVE status shown by this response schema.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profile_hash
                  - declaration_hash
                  - status
                properties:
                  profile_hash:
                    $ref: "#/components/schemas/Sha256"
                  declaration_hash:
                    $ref: "#/components/schemas/Sha256"
                  status:
                    const: ACTIVE
        "400":
          $ref: "#/components/responses/ContractError"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/authority-grants:
    post:
      tags:
        - Governance
      operationId: issueAuthorityGrant
      summary: Issue one scoped, time-bounded workload grant
      description: >-
        The first valid request records the grant once. An exact re-issue of a
        grant already on the chain is a replay: it returns 200 with the same
        grant_hash and records no second event. A differing body under an
        existing grant_id is a 409 conflict. A grant whose valid_until is not
        after the trusted processing clock is refused at issue with
        AUTHORITY_EXPIRED; a grant whose whole window lies in the future is
        issued and refuses use with AUTHORITY_NOT_YET_VALID until it opens.
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/authority_grant
      responses:
        "201":
          description: >-
            Grant issued. The HTTP adapter wraps the reference engine's
            returned grant hash with the request grant_id shown by this
            response schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantIssueResult"
        "200":
          description: >-
            Exact replay of a grant already on the chain: the same grant_hash,
            no second event recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantIssueResult"
        "400":
          $ref: "#/components/responses/ContractError"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/authority-revocations:
    post:
      tags:
        - Governance
      operationId: revokeAuthorityGrant
      summary: Revoke a grant and invalidate outstanding permits
      description: >-
        revoked_at may be at most five seconds ahead of the trusted
        processing clock. A later timestamp is rejected before state changes.
        Revocation is idempotent by state: a valid revocation of a grant that
        is already revoked returns 204 and records no second event, and a
        permit already invalidated for another reason keeps that reason. Every
        field of a repeated request is still validated, so a malformed repeat
        is refused exactly as a first attempt would be.
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/authority_revocation
      responses:
        "204":
          description: Revocation recorded
        "400":
          $ref: "#/components/responses/ContractError"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/operator/intents:evaluate:
    post:
      tags:
        - Operator
      operationId: evaluateIntent
      summary: Evaluate one intent and return a minimal operator result
      description: >-
        The response never exposes gate geometry, margins, sub-verdicts,
        thresholds, reason vectors, retained statistics, or architect trace.
        The referenced runtime schemas describe the internal evaluator input.
        A production HTTP adapter MUST NOT trust connector-supplied evidence
        status, prerequisite results, hard-block flags, or manual-review flags.
        It MUST resolve approved evidence, verify provenance and hashes, derive
        those control results inside the independent evaluator boundary, bind
        them to the request and current-state anchor, and overwrite the
        connector claims before invoking evaluation. The reference engine
        ships both injection points: an evidence resolver and a control
        resolver whose derived results replace the connector claims as gate
        inputs, are bound into the request hash, and fail closed on resolver
        exceptions or malformed output.
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.operator
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Must exactly equal intent.idempotency_key in the request body. A
            body that carries a different value is rejected as 409 before
            evaluation. A body that carries no idempotency_key at all is not a
            mismatch but an incomplete intent, refused as 400 INTENT_FIELDS.
          schema:
            type: string
            pattern: '^[A-Za-z][A-Za-z0-9._:-]{1,127}$'
            minLength: 2
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - intent
                - evidence_bundle
              properties:
                intent:
                  $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/intent
                evidence_bundle:
                  $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/evidence_bundle
      responses:
        "200":
          description: Executable or non-executable normalized result
          content:
            application/json:
              schema:
                $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/operator_result
        "400":
          $ref: "#/components/responses/ContractError"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/executor/permits/{permit_hash}:consume:
    post:
      tags:
        - Executor
      operationId: consumePermit
      summary: Commit one live permit with replay-safe receipt recovery
      description: >-
        The first valid request consumes and debits the permit at most once.
        The path and body permit_hash values MUST identify the same digest after
        hexadecimal case normalization. A mismatch MUST fail with
        EXECUTION_PERMIT_MISMATCH before permit lookup, replay, consumption, or
        debit. An exact canonical replay returns the stored execution receipt without
        another event or debit. A changed request for the consumed permit is a
        conflict.
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.executor
      parameters:
        - $ref: "#/components/parameters/PermitHash"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/execution_request
      responses:
        "200":
          description: >-
            Execution outcome recorded, or an exact stored receipt replayed
            without re-execution after a successful commit, including after
            permit, grant, or declaration expiry or revocation
          content:
            application/json:
              schema:
                $ref: ../core/schemas/runtime-contracts.schema.json#/$defs/execution_receipt
        "400":
          $ref: "#/components/responses/ContractError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /v1/architect/permits/{permit_hash}:
    get:
      tags:
        - Architect
      operationId: getArchitectPermit
      summary: Read the post-event permit and gate trace
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.architect
      parameters:
        - $ref: "#/components/parameters/PermitHash"
      responses:
        "400":
          $ref: "#/components/responses/ContractError"
        "200":
          description: Architect-only post-event record
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - permit_body
                  - permit_hash
                  - signature
                  - consumed
                  - reservation_active
                  - invalidated_reason
                properties:
                  permit_body:
                    $ref: "../core/schemas/runtime-contracts.schema.json#/$defs/execution_permit"
                  permit_hash:
                    $ref: "#/components/schemas/Sha256"
                  signature:
                    $ref: "#/components/schemas/SignatureEnvelope"
                  consumed:
                    type: boolean
                  reservation_active:
                    type: boolean
                  invalidated_reason:
                    oneOf:
                      - type: "null"
                      - type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/architect/decisions/{request_hash}:
    get:
      tags:
        - Architect
      operationId: getArchitectDecision
      summary: Read a post-event decision trace
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.architect
      parameters:
        - name: request_hash
          in: path
          required: true
          description: >-
            Hexadecimal SHA-256, accepted in either case. A value that is not a
            well-formed digest is a contract error (400); a well-formed digest
            that names no decision is 404.
          schema:
            $ref: "#/components/schemas/Sha256"
      responses:
        "400":
          $ref: "#/components/responses/ContractError"
        "200":
          description: >-
            Architect-only decision trace. permit_hash is present only when the
            disposition is ALLOW; gate_bit, structural_gate, and effect_gate are
            null when the decision was taken before the gate was engaged.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - intent_id
                  - request_hash
                  - disposition
                  - message_code
                  - gate_engaged
                  - gate_bit
                  - structural_gate
                  - effect_gate
                  - recorded_at
                properties:
                  intent_id:
                    type: string
                  request_hash:
                    $ref: "#/components/schemas/Sha256"
                  disposition:
                    enum:
                      - ALLOW
                      - REFUSAL
                      - MANUAL_REVIEW
                  message_code:
                    type: string
                  gate_engaged:
                    type: boolean
                  gate_bit:
                    oneOf:
                      - type: "null"
                      - enum:
                          - 0
                          - 1
                  structural_gate:
                    oneOf:
                      - type: "null"
                      - type: boolean
                  effect_gate:
                    oneOf:
                      - type: "null"
                      - type: boolean
                  permit_hash:
                    $ref: "#/components/schemas/Sha256"
                  recorded_at:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/architect/ledger/head:
    get:
      tags:
        - Architect
      operationId: getLedgerHead
      summary: Verify the local append-only chain head
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.architect
      responses:
        "200":
          description: Current chain head
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - event_count
                  - head_hash
                properties:
                  event_count:
                    type: integer
                    minimum: 0
                  head_hash:
                    $ref: "#/components/schemas/Sha256"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/registry/connectors/{connector_id}:
    get:
      tags:
        - Registry
      operationId: getRegistryRecord
      summary: Read the hash-only connector projection
      security:
        - mutualTLS: []
          OAuth2:
            - nc25.architect
      parameters:
        - name: connector_id
          in: path
          required: true
          description: >-
            Exact connector selector. A well-formed but different or unknown value
            returns 404; the server MUST NOT substitute the active connector. A
            selector that is not a well-formed identifier is a contract error (400).
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/ContractError"
        "200":
          description: Hash-only registry record
          content:
            application/json:
              schema:
                $ref: ../core/schemas/registry-record.schema.json
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Enterprise-managed mutual TLS is required on every route.
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            nc25.governance: Activate declarations and manage authority.
            nc25.operator: Submit bound intents and receive minimal results.
            nc25.executor: Consume a live permit exactly once.
            nc25.architect: Read post-event evidence and hash-only projections.
  parameters:
    PermitHash:
      name: permit_hash
      in: path
      required: true
      description: >-
        Hexadecimal SHA-256, accepted in either case. A value that is not a
        well-formed digest is a contract error (400); a well-formed digest that
        names no permit is 404.
      schema:
        $ref: "#/components/schemas/Sha256"
  schemas:
    Sha256:
      type: string
      pattern: "^[A-Fa-f0-9]{64}$"
    GrantIssueResult:
      type: object
      additionalProperties: false
      required:
        - grant_id
        - grant_hash
      properties:
        grant_id:
          type: string
        grant_hash:
          $ref: "#/components/schemas/Sha256"
    SignatureEnvelope:
      description: >-
        Versioned detached signature over the permit hash. Verification MUST
        route by key_id to the key custody source and MUST fail closed on an
        unknown algorithm, an unknown or revoked key_id, or a field-set
        mismatch. The reference engine ships HMAC-SHA256 (hex signature) and
        Ed25519 (base64 signature) through the same envelope; a production
        signer supplies managed keys without changing this shape.
      type: object
      additionalProperties: false
      required:
        - version
        - algorithm
        - key_id
        - signature
      properties:
        version:
          type: string
          minLength: 1
        algorithm:
          type: string
          minLength: 1
        key_id:
          type: string
          minLength: 1
          maxLength: 200
        signature:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          description: >-
            The complete vocabulary a caller can receive: every engine refusal
            code, every adapter wire code, and every code the adapter re-emits
            from an integrity halt. Generated from the shipped source by the
            failure-surface scan and held in step with it by the package
            verifier; adding a code to the engine or the adapter without
            adding it here fails acceptance.
          type: string
          enum:
            - ACTION_DESCRIPTION
            - ACTION_RESOURCE_IDS
            - ACTIVATE_BODY
            - ACTIVATE_DECLARATION_MISMATCH
            - ACTIVATE_PROFILE_MISMATCH
            - ACTIVATION_ACTOR
            - ACTIVATION_ACTOR_UNAUTHORIZED
            - ACTIVATION_EVIDENCE_REQUIRED
